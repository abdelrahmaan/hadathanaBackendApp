# docker-compose.yml — Base configuration (shared by dev and prod)
#
# Dev:  docker compose up -d                    (auto-loads override)
# Prod: docker compose -p hadathana-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# See also: Makefile for shorthand commands.

services:
  # ── Database ──────────────────────────────────────────────────
  mongo:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Data bootstrap (runs once, then exits) ────────────────────
  # Imports JSONL files, creates indexes, computes stats, applies
  # topics + embeddings. Skips everything if data already exists.
  mongo-init:
    build: .
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./mongo_migration:/app/mongo_migration:ro
      - ./hadith_topics.jsonl:/app/hadith_topics.jsonl:ro
      - ./hadith_embeddings.jsonl:/app/hadith_embeddings.jsonl:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # ── API server ────────────────────────────────────────────────
  api:
    build: .
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Future services ───────────────────────────────────────────
