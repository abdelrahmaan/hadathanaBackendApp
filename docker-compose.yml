# docker-compose.yml — Full application stack
#
# This is the single entry point for running the hadathana backend.
# It manages MongoDB, data bootstrapping, and the API server.
#
# Usage:
#   docker compose up -d           # start all services (detached)
#   docker compose logs -f api     # follow API logs
#   docker compose logs -f         # follow all logs
#   docker compose restart api     # restart API (e.g. after code change)
#   docker compose down            # stop everything (data persists in volume)
#   docker compose down -v         # ⚠️ DESTROYS ALL DATA — use only to full reset
#
# The mongo-init service auto-bootstraps if the database is empty.
# On normal restarts it detects existing data and exits in <1s.
#
# To add future services (monitoring, vector DB, etc.), add them below.

services:
  # ── Database ──────────────────────────────────────────────────
  mongo:
    image: mongo:8
    container_name: mongodb-hadathana
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Data bootstrap (runs once, then exits) ────────────────────
  # Imports JSONL files, creates indexes, computes stats, applies
  # topics + embeddings. Skips everything if data already exists.
  mongo-init:
    build: .
    container_name: hadathana-mongo-init
    command: python scripts/bootstrap_local_db.py --db HadithDataDev --uri mongodb://mongo:27017/
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./mongo_migration:/app/mongo_migration:ro
      - ./hadith_topics.jsonl:/app/hadith_topics.jsonl:ro
      - ./hadith_embeddings.jsonl:/app/hadith_embeddings.jsonl:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # ── API server ────────────────────────────────────────────────
  api:
    build: .
    container_name: hadathana-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - MONGODB_URI_LOCAL=mongodb://mongo:27017/
      - DB_NAME_DEV=HadithDataDev
      - CORS_ORIGINS_DEV=http://localhost:3000,http://localhost:5173
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app/app
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Future services ───────────────────────────────────────────
  # Uncomment and configure as needed:
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   restart: unless-stopped
  #
  # mongo-express:
  #   image: mongo-express:latest
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  mongodb_data:
    name: mongodb_hadathana_data
    external: true
